<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inquiry · Pharmasan</title>
<meta name="description" content="Send Pharmasan an inquiry for licensed, unlicensed or other pharmaceutical products.">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/square.png">
<link rel="stylesheet" href="assets/css/site.css?v=5">
<script>
(function () {
  if (!/[?&]r=/.test(location.search)) return;
  var s = document.createElement('script');
  s.async = true;
  s.referrerPolicy = 'no-referrer';
  s.setAttribute('data-landing', location.href);
  s.src = 'https://phplaravel-758037-6569212.cloudwaysapps.com/v/script.js';
  document.head.appendChild(s);

</head>
<body data-page="inquiry">
<main>
  <section class="page-hero">
    <h1 class="h-display" data-lines><span class="line"><span>Tell us what</span></span><span class="line"><span>you are <span class="red">looking for.</span></span></span></h1>
    <p class="lead">Please use the form below to proceed with your inquiry for the products you are looking for. We reply with an offer.</p>
  </section>
  <section class="form-wrap">
    <aside class="form-aside rv">
      <div class="wide-img" style="margin:0;height:clamp(260px,26vw,460px)" data-parallax><img src="assets/img/hf/09-logger.jpg" alt="Temperature data logger on an insulated shipping box" style="object-position:50% 45%"></div>
      <p class="h-m">Prefer to call?</p>
      <p><a class="link" href="tel:+38631274674">+386 31 274 674</a></p>
      <p><a class="link" href="mailto:info@pharmasan.si">info@pharmasan.si</a></p>
    </aside>
    <form class="f rv" novalidate>
      <div class="full"><label>Organisation type</label><div class="chips" style="margin-top:12px">
        <label><input type="radio" name="org" value="wholesale" checked><span>Wholesale company</span></label>
        <label><input type="radio" name="org" value="manufacturer"><span>Pharmaceutical manufacturer</span></label>
        <label><input type="radio" name="org" value="healthcare"><span>Healthcare organisation</span></label>
      </div></div>
      <div class="full"><label>Product type</label><div class="chips" style="margin-top:12px">
        <label><input type="radio" name="product" value="licensed" checked><span>Licensed product</span></label>
        <label><input type="radio" name="product" value="unlicensed"><span>Unlicensed product</span></label>
        <label><input type="radio" name="product" value="other"><span>Other product</span></label>
      </div></div>
      <label>Title<select name="title"><option>Mr</option><option>Ms</option><option>Mrs</option></select></label>
      <label>Full name<input name="name" autocomplete="name" required></label>
      <label>Organisation<input name="company" autocomplete="organization"></label>
      <label>Country<input name="country" autocomplete="country-name"></label>
      <label>E-mail<input type="email" name="email" autocomplete="email" required></label>
      <label>Phone<input type="tel" name="phone" autocomplete="tel"></label>
      <label class="full">Product name, strength and form<input name="item" placeholder="e.g. active substance, 500 mg tablets"></label>
      <label>Quantity<input name="qty"></label>
      <label>Needed by<input type="date" name="date"></label>
      <label class="full">Message<textarea name="msg"></textarea></label>
      <label class="full check"><input type="checkbox" required> I agree that Pharmasan processes my data to answer this inquiry.</label>
      <div class="full"><button class="btn" type="submit">Send inquiry <span class="arr">→</span></button></div>
      <div class="sent"><p class="h-l">Thank you.</p><p class="lead" style="margin-top:16px">Your inquiry is with our team. We will send you our offer shortly.</p></div>
    </form>
  </section>
</main>
<div id="footer"></div>
<script src="assets/js/vendor/gsap.min.js"></script>
<script src="assets/js/vendor/ScrollTrigger.min.js"></script>
<script src="assets/js/vendor/lenis.min.js"></script>
<script src="assets/js/site.js?v=3"></script>
</body>
</html>
